<section class="contact">
  <div class="contact__container container">
    <span class="contact__label">CONTACT</span>
    <h1 class="contact__headline">Get in touch</h1>
    <p class="contact__sub">
      Have questions about MoneyHound? Need a custom dataset configuration? We
      respond within 24 hours.
    </p>

    <div class="contact__grid">
      <form class="contact__form">
        <div class="contact__field">
          <label mh-label for="name">NAME</label>
          <input mh-input type="text" id="name" placeholder="Your name" />
        </div>
        <div class="contact__field">
          <label mh-label for="email">EMAIL</label>
          <input mh-input type="email" id="email" placeholder="you@company.com" />
        </div>
        <div class="contact__field">
          <label mh-label for="message">MESSAGE</label>
          <textarea mh-textarea id="message" [rows]="5" placeholder="Tell us about your use case..."></textarea>
        </div>
        <button type="submit" mh-button>Send Message</button>
      </form>

      <div class="contact__sidebar">
        <div class="contact__info">
          <h3 class="contact__info-title">Email</h3>
          <p class="contact__info-value">hello@moneyhound.io</p>
        </div>
        <div class="contact__info">
          <h3 class="contact__info-title">Response time</h3>
          <p class="contact__info-value">Within 24 hours on business days</p>
        </div>
        <div class="contact__info">
          <h3 class="contact__info-title">Enterprise</h3>
          <p class="contact__info-value">
            For volume pricing and custom deployments, reach out directly.
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
