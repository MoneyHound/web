<div class="register-container">
  <h1>Register</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mh-form-group
      label="Email"
      for="email"
      [control]="form.get('email')"
      [errors]="{ required: 'Email is required', email: 'Please enter a valid email' }"
    >
      <input
        mh-input
        type="email"
        id="email"
        formControlName="email"
        placeholder="Enter your email"
      />
    </mh-form-group>

    <mh-form-group
      label="Organization"
      for="organization"
      [control]="form.get('organization')"
      [errors]="{ required: 'Organization is required', minlength: 'Organization must be at least 3 characters' }"
    >
      <input
        mh-input
        type="text"
        id="organization"
        formControlName="organization"
        placeholder="What's your organization"
      />
    </mh-form-group>

    <button
      mh-button
      variant="primary"
      size="lg"
      type="submit"
      [disabled]="isLoading() || form.invalid"
    >
      @if (isLoading()) {
        Registering...
      } @else {
        Register
      }
    </button>
  </form>

  <p class="auth-link">
    Already have an account? <a mh-button [variant]="'ghost'" [size]="'sm'" [href]="signInRoute()">Sign In</a>
  </p>
</div>
