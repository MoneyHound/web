<div class="mh-simulation-card">
  <div class="mh-simulation-card__header">
    <span class="material-symbols-outlined mh-simulation-card__icon">simulation</span>
    <div class="mh-simulation-card__header-content">
      <h3 class="mh-simulation-card__title">{{ simulation().title }}</h3>
    </div>
  </div>

  <div class="mh-simulation-card__footer">
    <div class="mh-simulation-card__meta">
      <span class="mh-simulation-card__meta-item">
        <span class="material-symbols-outlined mh-simulation-card__meta-icon">schedule</span>
        {{ simulation().days }} day{{ simulation().days !== 1 ? 's' : '' }}
      </span>
      <span class="mh-simulation-card__meta-item">
        <span class="material-symbols-outlined mh-simulation-card__meta-icon">calendar_today</span>
        {{ simulation().created_at | date:'mediumDate' }}
      </span>
    </div>
    <span class="mh-simulation-card__status" [class]="getStatusClass(simulation().status)">
      {{ getStatusLabel(simulation().status) }}
    </span>
  </div>
</div>
